name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test

  # Packaging breaks on things typechecking cannot see — an icon in the wrong
  # format, a resource path that only exists on one platform, a file list that
  # drops something the app needs at runtime. Catching that at a tag is
  # catching it too late, so every platform we ship packages on every PR.
  # `--dir` stops short of building installers, which is the slow half.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only, matching what release.yml and nightly.yml ship. This
        # list exists to cover what gets released — restore macos-latest here
        # the moment it goes back into those, or the first macOS packaging
        # break will surface at a tag instead of on the PR that caused it.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@luumen/code-app

      - name: Package, without building installers
        working-directory: packages/app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config electron-builder.cjs --publish never --dir

  plugin:
    name: Studio plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin is a Luumen project, so CI runs the same tasks a contributor
      # does rather than a second copy of the tool invocations.
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Install Luumen
        run: |
          curl -fsSL https://luumen.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: luu install
        working-directory: plugin
      - run: luu run check
        working-directory: plugin
      - run: luu run bundle
        working-directory: plugin

      - uses: actions/upload-artifact@v4
        with:
          name: LuuCode.rbxm
          path: plugin/LuuCode.rbxm
